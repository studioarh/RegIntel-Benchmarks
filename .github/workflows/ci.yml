name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff Linter & Formatter
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy Strict Typecheck
        run: |
          mypy --strict --explicit-package-bases src/ apps/ config/
      - name: Pytest Unit & Benchmark Validation Suite
        run: |
          pytest -v tests/
